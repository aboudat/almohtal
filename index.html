<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="المحتال - لعبة جماعية بجهاز واحد. مرر الجهاز، اكتشف المحتال.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>المحتال</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg:#f4f5fa;
    --surface:#ffffff;
    --ink:#14121f;
    --dim:#75748e;
    --line:#e5e6f0;
    --brand:#6d3bf5;
    --brand-2:#8b5cff;
    --brand-soft:#f0eaff;
    --danger:#ff3355;
    --danger-2:#ff5f7a;
    --danger-soft:#ffedf0;
    --sx: 100%;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --sh-sm: 0 1px 2px rgba(20,18,31,.06), 0 3px 10px rgba(20,18,31,.05);
    --sh-md: 0 2px 6px rgba(20,18,31,.07), 0 14px 34px rgba(20,18,31,.10);
  }
  [dir="rtl"] { --sx: -100%; }

  html, body {
    width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family: system-ui, 'Segoe UI', 'Noto Sans Arabic', Tahoma, sans-serif;
    user-select:none; -webkit-user-select:none;
  }

  /* ---------------- screens and transitions ---------------- */
  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg);
    visibility:hidden; opacity:0; transform:translateX(0) scale(.98);
    transition: transform .34s cubic-bezier(.33,.7,.2,1), opacity .26s ease;
  }
  .screen.on   { visibility:visible; opacity:1; transform:none; z-index:2; }
  .screen.pre-f{ visibility:visible; opacity:0; transform:translateX(var(--sx)); transition:none; }
  .screen.pre-b{ visibility:visible; opacity:0; transform:translateX(calc(var(--sx) * -1)); transition:none; }
  .screen.out-f{ visibility:visible; opacity:0; transform:translateX(calc(var(--sx) * -.26)) scale(.97); z-index:1; }
  .screen.out-b{ visibility:visible; opacity:0; transform:translateX(calc(var(--sx) * .26)) scale(.97); z-index:1; }

  /* ---------------- chrome ---------------- */
  .top { display:flex; align-items:center; gap:10px; flex:0 0 auto;
         padding:calc(14px + var(--safe-t)) 16px 8px; }
  .top h2 { font-size:19px; font-weight:800; flex:1 1 auto; }
  .icon-btn { flex:0 0 auto; width:42px; height:42px; border-radius:14px; background:var(--surface);
              border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:19px;
              font-weight:700; cursor:pointer; box-shadow:var(--sh-sm); line-height:1; }
  .icon-btn:active { transform:scale(.94); }
  .lang { flex:0 0 auto; height:42px; min-width:52px; padding:0 15px; border-radius:14px;
          background:var(--surface); border:1px solid var(--line); color:var(--brand);
          font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; box-shadow:var(--sh-sm); }
  .lang:active { transform:scale(.94); }

  .scroll { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 24px; }
  .bot { flex:0 0 auto; padding:10px 16px calc(14px + var(--safe-b)); }

  /* ---------------- buttons ---------------- */
  .primary, .danger, .quiet {
    width:100%; font-family:inherit; font-size:20px; font-weight:800; padding:18px;
    border:none; border-radius:18px; cursor:pointer; transition:transform .12s ease, opacity .2s ease;
  }
  .primary { background:linear-gradient(135deg, var(--brand-2), var(--brand)); color:#fff;
             box-shadow:0 6px 18px rgba(109,59,245,.34); }
  .primary:active { transform:scale(.975); }
  .primary:disabled { background:#d9dae6; color:#fff; box-shadow:none; transform:none; }
  .danger { background:linear-gradient(135deg, var(--danger-2), var(--danger)); color:#fff;
            box-shadow:0 6px 18px rgba(255,51,85,.30); }
  .danger:active { transform:scale(.975); }
  .quiet { background:var(--surface); border:1px solid var(--line); color:var(--dim);
           font-size:17px; padding:16px; box-shadow:var(--sh-sm); }
  .quiet:active { transform:scale(.975); }
  .bot .quiet { margin-top:10px; }
  .link { display:block; width:100%; background:none; border:none; color:var(--dim);
          font-family:inherit; font-size:15px; font-weight:700; padding:14px; cursor:pointer; margin-top:2px; }
  .link:active { color:var(--brand); }
  .veil { opacity:0; pointer-events:none; }

  /* ---------------- home ---------------- */
  .home { flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; padding:24px; gap:6px; }
  .logo { width:132px; height:132px; margin-bottom:10px;
          filter:drop-shadow(0 14px 26px rgba(109,59,245,.30)); animation:pop .5s cubic-bezier(.2,1.3,.4,1) both; }
  .home-title { font-size:48px; font-weight:900; letter-spacing:-.5px;
                animation:rise .45s .08s cubic-bezier(.2,.9,.3,1) both; }
  .home-tag { font-size:17px; color:var(--dim); font-weight:600; max-width:280px; line-height:1.6;
              animation:rise .45s .16s cubic-bezier(.2,.9,.3,1) both; }
  .home .bot, #scr-home .bot { animation:rise .45s .24s cubic-bezier(.2,.9,.3,1) both; }
  .lang-abs { position:absolute; top:calc(14px + var(--safe-t)); inset-inline-end:16px; }
  @keyframes pop  { from { opacity:0; transform:scale(.7) rotate(-8deg); } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }

  /* ---------------- setup ---------------- */
  .lead { color:var(--dim); font-size:15px; line-height:1.6; margin:2px 0 16px; }
  .sec { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:24px 0 10px; }
  .sec h3 { font-size:13px; font-weight:800; color:var(--dim); letter-spacing:1.2px; text-transform:uppercase; }
  .sec .mini { display:flex; gap:6px; }
  .mini button { background:none; border:none; color:var(--brand); font-family:inherit;
                 font-size:13px; font-weight:800; padding:5px 8px; border-radius:8px; cursor:pointer; }
  .mini button:active { background:var(--brand-soft); }

  .prow { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .dot { flex:0 0 38px; height:38px; border-radius:13px; color:#fff; font-size:15px; font-weight:800;
         display:flex; align-items:center; justify-content:center; }
  .prow input {
    flex:1 1 auto; min-width:0; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-size:17px; font-weight:600; font-family:inherit; padding:14px; border-radius:14px;
    outline:none; box-shadow:var(--sh-sm); transition:border-color .18s ease;
  }
  .prow input:focus { border-color:var(--brand); }
  .prow input::placeholder { color:#b6b6c8; font-weight:500; }
  .prow .del { flex:0 0 40px; height:44px; background:none; border:none; color:#c3c3d4;
               font-size:24px; cursor:pointer; line-height:1; font-family:inherit; }
  .prow .del:active { color:var(--danger); }
  .prow .del:disabled { opacity:.35; }

  .ghost { width:100%; background:var(--brand-soft); border:none; color:var(--brand);
           font-family:inherit; font-size:16px; font-weight:800; padding:15px; border-radius:14px;
           cursor:pointer; margin-top:4px; }
  .ghost:active { transform:scale(.98); }
  .ghost:disabled { opacity:.4; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
         background:var(--surface); border:1px solid var(--line); border-radius:16px;
         padding:12px 14px; margin-bottom:10px; box-shadow:var(--sh-sm); }
  .row > span { font-size:16px; font-weight:700; }
  .seg { display:flex; gap:5px; flex:0 0 auto; background:#f0f0f6; padding:4px; border-radius:12px; }
  .seg button { background:none; border:none; color:var(--dim); font-family:inherit;
                font-size:15px; font-weight:800; padding:8px 12px; border-radius:9px; cursor:pointer;
                min-width:42px; transition:background .16s ease, color .16s ease; }
  .seg button.on { background:var(--surface); color:var(--brand); box-shadow:var(--sh-sm); }
  .seg button:disabled { opacity:.35; }

  .cats { display:flex; flex-wrap:wrap; gap:8px; }
  .cats button { background:var(--surface); border:1px solid var(--line); color:var(--dim);
                 font-family:inherit; font-size:15px; font-weight:700; padding:11px 15px;
                 border-radius:999px; cursor:pointer; box-shadow:var(--sh-sm);
                 transition:transform .12s ease, background .16s ease, color .16s ease, border-color .16s ease; }
  .cats button.on { background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 4px 12px rgba(109,59,245,.26); }
  .cats button:active { transform:scale(.95); }

  .warn { color:var(--danger); font-size:14px; font-weight:700; margin-top:14px; min-height:20px; line-height:1.5; }

  /* ---------------- pass ---------------- */
  .mid { flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
         justify-content:center; text-align:center; padding:20px; gap:14px; }
  .step { position:absolute; top:calc(18px + var(--safe-t)); inset-inline-start:20px;
          font-size:14px; color:var(--dim); font-weight:800; }
  .exit { position:absolute; top:calc(10px + var(--safe-t)); inset-inline-end:14px;
          background:none; border:none; color:#b9b9cb; font-family:inherit; font-size:28px;
          line-height:1; padding:6px 12px; cursor:pointer; }
  .exit:active { color:var(--danger); }
  .avatar { width:96px; height:96px; border-radius:34px; color:#fff; font-size:40px; font-weight:900;
            display:flex; align-items:center; justify-content:center; margin-bottom:4px;
            animation:pop .42s cubic-bezier(.2,1.3,.4,1) both; }
  .kicker { font-size:16px; color:var(--dim); font-weight:700; }
  .bigname { font-size:40px; font-weight:900; line-height:1.2; word-break:break-word; }
  .hint { font-size:15px; color:var(--dim); line-height:1.6; max-width:320px; font-weight:600; }

  /* ---------------- flip card ---------------- */
  .flip { width:100%; max-width:330px; height:clamp(300px, 52vh, 430px); perspective:1500px; cursor:pointer; }
  .flip-in { position:relative; width:100%; height:100%; transform-style:preserve-3d;
             transition:transform .62s cubic-bezier(.4,.02,.2,1); }
  .flip.flipped .flip-in { transform:rotateY(180deg); }
  .flip:active .flip-in { transform:scale(.97); }
  .flip.flipped:active .flip-in { transform:rotateY(180deg) scale(.97); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
          border-radius:28px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; padding:26px; gap:10px; box-shadow:var(--sh-md); }
  .face.front { transform:rotateY(180deg); }
  .cb-name { font-size:26px; font-weight:900; color:#fff; }
  .cb-hint { font-size:15px; font-weight:700; color:rgba(255,255,255,.85); }
  .cb-mark { position:absolute; width:74%; left:13%; top:50%; transform:translateY(-56%);
             pointer-events:none; }
  .face.word { background:var(--surface); border:1px solid var(--line); }
  .catchip { font-size:14px; font-weight:800; color:var(--brand); background:var(--brand-soft);
             padding:7px 14px; border-radius:999px; }
  .theword { font-size:36px; font-weight:900; line-height:1.25; word-break:break-word; }
  .face.imp { background:linear-gradient(150deg, var(--danger-2), var(--danger)); }
  .imptitle { font-size:34px; font-weight:900; color:#fff; line-height:1.25; }
  .impsub { font-size:15px; font-weight:600; color:rgba(255,255,255,.9); line-height:1.6; }

  /* ---------------- play ---------------- */
  .timer { font-size:70px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:1px; direction:ltr; }
  .timer.done { color:var(--danger); font-size:44px; }

  /* ---------------- reveal ---------------- */
  .revealbox { width:100%; max-width:340px; display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px;
           box-shadow:var(--sh-sm); animation:rise .4s cubic-bezier(.2,.9,.3,1) both; }
  .panel.red { background:linear-gradient(150deg, var(--danger-2), var(--danger)); border:none;
               box-shadow:0 8px 24px rgba(255,51,85,.28); }
  .panel:nth-child(2) { animation-delay:.1s; }
  .plbl { font-size:13px; font-weight:800; color:var(--dim); letter-spacing:1.2px; margin-bottom:7px; }
  .panel.red .plbl { color:rgba(255,255,255,.85); }
  .pval { font-size:28px; font-weight:900; line-height:1.35; word-break:break-word; }
  .panel.red .pval { color:#fff; }

  /* ---------------- sheets ---------------- */
  .sheet { position:fixed; inset:0; background:rgba(20,18,31,.42); backdrop-filter:blur(3px);
           display:flex; align-items:flex-end; justify-content:center; padding:14px;
           padding-bottom:calc(14px + var(--safe-b)); z-index:50;
           opacity:0; pointer-events:none; transition:opacity .24s ease; }
  .sheet.on { opacity:1; pointer-events:auto; }
  .sheet .box { width:100%; max-width:420px; background:var(--surface); border-radius:26px; padding:24px;
                text-align:center; box-shadow:var(--sh-md);
                transform:translateY(18px); transition:transform .3s cubic-bezier(.2,.9,.3,1); }
  .sheet.on .box { transform:none; }
  .sheet .box p { font-size:18px; font-weight:700; line-height:1.6; margin-bottom:18px; }
  .sheet h3 { font-size:22px; font-weight:900; margin-bottom:16px; }
  .steps { text-align:start; display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
  .stepline { display:flex; gap:12px; align-items:flex-start; }
  .stepline b { flex:0 0 28px; height:28px; border-radius:10px; background:var(--brand-soft);
                color:var(--brand); font-size:14px; font-weight:900;
                display:flex; align-items:center; justify-content:center; }
  .stepline span { font-size:15px; font-weight:600; line-height:1.55; color:var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .screen, .flip-in, .sheet, .sheet .box { transition-duration:.01s !important; }
    .logo, .home-title, .home-tag, .avatar, .panel, #scr-home .bot { animation:none !important; }
  }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="scr-home" class="screen on">
  <button id="homeLang" class="lang lang-abs">EN</button>
  <div class="home">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8b5cff"/>
          <stop offset="1" stop-color="#5b28e0"/>
        </linearGradient>
        <mask id="eyes">
          <rect width="100" height="100" fill="#fff"/>
          <ellipse cx="34" cy="46" rx="11" ry="7" transform="rotate(-11 34 46)" fill="#000"/>
          <ellipse cx="66" cy="46" rx="11" ry="7" transform="rotate(11 66 46)" fill="#000"/>
        </mask>
      </defs>
      <path mask="url(#eyes)" fill="url(#lg)"
            d="M16 43 C24 27, 43 25, 50 36 C57 25, 76 27, 84 43 C89 57, 77 75, 63 72 C56 70, 53 64, 50 63 C47 64, 44 70, 37 72 C23 75, 11 57, 16 43 Z"/>
    </svg>
    <h1 class="home-title" id="homeTitle">المحتال</h1>
    <p class="home-tag" data-t="tagline"></p>
  </div>
  <footer class="bot">
    <button id="homePlay" class="primary" data-t="play"></button>
    <button id="howBtn" class="link" data-t="howToPlay"></button>
  </footer>
</section>

<!-- ================= SETUP ================= -->
<section id="scr-setup" class="screen">
  <header class="top">
    <button id="setupBack" class="icon-btn">→</button>
    <h2 data-t="setupTitle"></h2>
    <button id="langBtn" class="lang">EN</button>
  </header>
  <div class="scroll">
    <p class="lead" data-t="setupLead"></p>
    <div id="playerList"></div>
    <button id="addBtn" class="ghost" data-t="addPlayer"></button>

    <div class="sec"><h3 data-t="secSettings"></h3></div>
    <div class="row">
      <span data-t="impLabel"></span>
      <div class="seg" id="impSeg">
        <button data-v="1">1</button>
        <button data-v="2">2</button>
      </div>
    </div>
    <div class="row">
      <span data-t="timerLabel"></span>
      <div class="seg" id="timerSeg">
        <button data-v="0" data-t="timerOff"></button>
        <button data-v="2">2</button>
        <button data-v="3">3</button>
        <button data-v="5">5</button>
      </div>
    </div>

    <div class="sec">
      <h3 data-t="secCats"></h3>
      <div class="mini">
        <button id="catAll" data-t="selectAll"></button>
        <button id="catNone" data-t="selectNone"></button>
      </div>
    </div>
    <div id="catList" class="cats"></div>
    <p id="setupWarn" class="warn"></p>
  </div>
  <footer class="bot">
    <button id="startBtn" class="primary" data-t="startGame"></button>
  </footer>
</section>

<!-- ================= PASS ================= -->
<section id="scr-pass" class="screen">
  <div class="step" id="passStep"></div>
  <button class="exit" id="exitBtn" aria-label="exit">×</button>
  <div class="mid">
    <div class="avatar" id="passAvatar"></div>
    <div class="kicker" data-t="passTo"></div>
    <div class="bigname" id="passName"></div>
    <div class="hint" data-t="passHint"></div>
  </div>
  <footer class="bot">
    <button id="imBtn" class="primary"></button>
  </footer>
</section>

<!-- ================= CARD ================= -->
<section id="scr-card" class="screen">
  <div class="step" id="cardStep"></div>
  <div class="mid">
    <div class="flip" id="flip">
      <div class="flip-in">
        <div class="face back" id="cardBack">
          <svg class="cb-mark" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <mask id="eyes2">
                <rect width="100" height="100" fill="#fff"/>
                <ellipse cx="34" cy="46" rx="11" ry="7" transform="rotate(-11 34 46)" fill="#000"/>
                <ellipse cx="66" cy="46" rx="11" ry="7" transform="rotate(11 66 46)" fill="#000"/>
              </mask>
            </defs>
            <path mask="url(#eyes2)" fill="rgba(255,255,255,.20)"
                  d="M16 43 C24 27, 43 25, 50 36 C57 25, 76 27, 84 43 C89 57, 77 75, 63 72 C56 70, 53 64, 50 63 C47 64, 44 70, 37 72 C23 75, 11 57, 16 43 Z"/>
          </svg>
          <div class="cb-name" id="cbName"></div>
          <div class="cb-hint" data-t="tapToFlip"></div>
        </div>
        <div class="face front" id="cardFront"></div>
      </div>
    </div>
  </div>
  <footer class="bot">
    <button id="doneBtn" class="primary veil" data-t="hideAndPass"></button>
  </footer>
</section>

<!-- ================= STARTER ================= -->
<section id="scr-starter" class="screen">
  <div class="mid">
    <div class="avatar" id="starterAvatar"></div>
    <div class="kicker" data-t="starterKicker"></div>
    <div class="bigname" id="starterName"></div>
    <div class="hint" data-t="starterHint"></div>
  </div>
  <footer class="bot">
    <button id="playBtn" class="primary" data-t="beginRound"></button>
  </footer>
</section>

<!-- ================= PLAY ================= -->
<section id="scr-play" class="screen">
  <div class="mid">
    <div class="kicker" data-t="playKicker"></div>
    <div class="timer" id="timerEl">--:--</div>
    <div class="hint" id="playHint"></div>
  </div>
  <footer class="bot">
    <button id="revealBtn" class="danger" data-t="revealImposter"></button>
  </footer>
</section>

<!-- ================= REVEAL ================= -->
<section id="scr-reveal" class="screen">
  <div class="mid">
    <div class="revealbox">
      <div class="panel red">
        <div class="plbl" id="impPanelLbl"></div>
        <div class="pval" id="impPanelVal"></div>
      </div>
      <div class="panel">
        <div class="plbl" data-t="theWordWas"></div>
        <div class="pval" id="wordPanelVal"></div>
      </div>
    </div>
  </div>
  <footer class="bot">
    <button id="againBtn" class="primary" data-t="playAgain"></button>
    <button id="backBtn" class="quiet" data-t="changePlayers"></button>
  </footer>
</section>

<!-- ================= SHEETS ================= -->
<div class="sheet" id="confirmSheet">
  <div class="box">
    <p id="sheetMsg"></p>
    <button id="confirmYes" class="danger"></button>
    <button id="confirmNo" class="quiet" data-t="cancel"></button>
  </div>
</div>

<div class="sheet" id="howSheet">
  <div class="box">
    <h3 data-t="howToPlay"></h3>
    <div class="steps" id="howSteps"></div>
    <button id="howClose" class="primary" data-t="gotIt"></button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

(() => {
  'use strict';

  /* ---------------- word bank ---------------- */
  const CATEGORIES = [
    { id:'food', ar:'أكل وشرب', en:'Food & Drink', words:[
      ['كبسة','Kabsa'],['برجر','Burger'],['بيتزا','Pizza'],['شاورما','Shawarma'],
      ['فلافل','Falafel'],['حمص','Hummus'],['معكرونة','Pasta'],['سوشي','Sushi'],
      ['قهوة','Coffee'],['شاي','Tea'],['عصير برتقال','Orange Juice'],['تمر','Dates'],
      ['آيس كريم','Ice Cream'],['شوكولاتة','Chocolate'],['بطاطس مقلية','French Fries'],
      ['دجاج مشوي','Grilled Chicken'],['سمك','Fish'],['أرز','Rice'],['خبز','Bread'],

  /* ---------------- state ---------------- */
  const KEY = 'almohtal.v1';
  const MIN_PLAYERS = 3, MAX_PLAYERS = 12, TWO_IMP_MIN = 7;

  const state = {
    lang:'ar',
    players:['', '', ''],
    imposters:1,
    timerMin:3,
    cats:CATEGORIES.map(c => c.id),
    roles:[], word:null, cat:null, idx:0, starter:0
  };

  const t = k => STR[state.lang][k];
  const $ = id => document.getElementById(id);
  const colorOf = i => COLORS[i % COLORS.length];

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!d) return;
      if (d.lang === 'ar' || d.lang === 'en') state.lang = d.lang;
      if (Array.isArray(d.players) && d.players.length >= MIN_PLAYERS)
        state.players = d.players.slice(0, MAX_PLAYERS).map(String);
      if (d.imposters === 1 || d.imposters === 2) state.imposters = d.imposters;
      if ([0, 2, 3, 5].indexOf(d.timerMin) >= 0) state.timerMin = d.timerMin;
      if (Array.isArray(d.cats)) {
        const valid = d.cats.filter(id => CATEGORIES.some(c => c.id === id));
        if (valid.length) state.cats = valid;
      }
    } catch (e) {}
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        lang:state.lang, players:state.players,
        imposters:state.imposters, timerMin:state.timerMin, cats:state.cats
      }));
    } catch (e) {}
  }

  /* ---------------- helpers ---------------- */
  function rand(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      const a = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / n) * n;   // reject the tail so modulo stays uniform
      do { window.crypto.getRandomValues(a); } while (a[0] >= limit);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function pickDistinct(count, n) {
    const pool = [];
    for (let i = 0; i < n; i++) pool.push(i);
    const out = [];
    for (let i = 0; i < count && pool.length; i++) out.push(pool.splice(rand(pool.length), 1)[0]);
    return out;
  }

  function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

  function nameOf(i) {
    const raw = (state.players[i] || '').trim();
    return raw || (t('defPlayer') + ' ' + (i + 1));
  }

  function paintAvatar(el, i) {
    el.style.background = 'linear-gradient(150deg, ' + colorOf(i) + ', ' + shade(colorOf(i), -22) + ')';
    el.textContent = nameOf(i).charAt(0);
  }

  // darken or lighten a hex colour by a percentage
  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    const f = (c) => Math.max(0, Math.min(255, Math.round(c + (c * pct / 100))));
    return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)]
      .map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* ---------------- screen transitions ---------------- */
  function show(id, dir) {
    const next = $(id);
    const cur = document.querySelector('.screen.on');
    if (!cur) { next.classList.add('on'); return; }
    if (cur === next) return;
    const back = dir === -1;
    next.classList.add(back ? 'pre-b' : 'pre-f');
    void next.offsetWidth;                       // commit the offscreen position first
    next.classList.remove('pre-b', 'pre-f');
    next.classList.add('on');
    cur.classList.remove('on');
    cur.classList.add(back ? 'out-b' : 'out-f');
    setTimeout(() => cur.classList.remove('out-b', 'out-f'), 420);
  }

  /* ---------------- language ---------------- */
  function applyLang() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('brand');
    $('homeTitle').textContent = t('brand');
    $('setupBack').textContent = t('backArrow');
    const label = state.lang === 'ar' ? 'EN' : 'ع';
    $('langBtn').textContent = label;
    $('homeLang').textContent = label;
    document.querySelectorAll('[data-t]').forEach(el => {
      const v = STR[state.lang][el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    renderHow();
    renderPlayers();
    renderCats();
    renderSegs();
    validate();
  }

  function renderHow() {
    const box = $('howSteps');
    box.innerHTML = '';
    t('steps').forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'stepline';
      const b = document.createElement('b');
      b.textContent = i + 1;
      const span = document.createElement('span');
      span.textContent = s;
      row.appendChild(b); row.appendChild(span);
      box.appendChild(row);
    });
  }

  /* ---------------- setup rendering ---------------- */
  function renderPlayers() {
    const list = $('playerList');
    list.innerHTML = '';
    state.players.forEach((val, i) => {
      const row = document.createElement('div');
      row.className = 'prow';

      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = colorOf(i);
      dot.textContent = i + 1;

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = val;
      inp.maxLength = 16;
      inp.autocomplete = 'off';
      inp.placeholder = t('defPlayer') + ' ' + (i + 1);
      inp.addEventListener('input', () => { state.players[i] = inp.value; save(); });

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.disabled = state.players.length <= MIN_PLAYERS;
      del.addEventListener('click', () => {
        if (state.players.length <= MIN_PLAYERS) return;
        state.players.splice(i, 1);
        save(); renderPlayers(); renderSegs(); validate();
      });

      row.appendChild(dot); row.appendChild(inp); row.appendChild(del);
      list.appendChild(row);
    });
    $('addBtn').disabled = state.players.length >= MAX_PLAYERS;
  }

  function renderCats() {
    const box = $('catList');
    box.innerHTML = '';
    CATEGORIES.forEach(c => {
      const b = document.createElement('button');
      b.textContent = c[state.lang];
      if (state.cats.indexOf(c.id) >= 0) b.classList.add('on');
      b.addEventListener('click', () => {
        const at = state.cats.indexOf(c.id);
        if (at >= 0) state.cats.splice(at, 1); else state.cats.push(c.id);
        b.classList.toggle('on');
        save(); validate();
      });
      box.appendChild(b);
    });
  }

  function renderSegs() {
    const twoOk = state.players.length >= TWO_IMP_MIN;
    if (!twoOk) state.imposters = 1;
    $('impSeg').querySelectorAll('button').forEach(b => {
      const v = +b.dataset.v;
      b.disabled = (v === 2 && !twoOk);
      b.classList.toggle('on', v === state.imposters);
    });
    $('timerSeg').querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', +b.dataset.v === state.timerMin);
    });
  }

  function validate() {
    const warn = [];
    if (state.players.length < MIN_PLAYERS) warn.push(t('warnMin'));
    if (state.cats.length === 0) warn.push(t('warnCat'));
    if (state.imposters === 2 && state.players.length < TWO_IMP_MIN) warn.push(t('warnImp'));
    $('setupWarn').textContent = warn.join(' ');
    $('startBtn').disabled = warn.length > 0;
  }

  /* ---------------- round flow ---------------- */
  function deal() {
    const pool = CATEGORIES.filter(c => state.cats.indexOf(c.id) >= 0);
    state.cat = pool[rand(pool.length)];
    state.word = state.cat.words[rand(state.cat.words.length)];

    const n = state.players.length;
    const k = Math.max(1, Math.min(state.imposters, n - 2));   // always leave two who know the word
    state.roles = new Array(n).fill(false);
    pickDistinct(k, n).forEach(i => { state.roles[i] = true; });

    state.starter = rand(n);
    state.idx = 0;
  }

  function showPass(dir) {
    $('passStep').textContent = t('stepOf')(state.idx + 1, state.players.length);
    $('passName').textContent = nameOf(state.idx);
    $('passName').style.color = colorOf(state.idx);
    $('imBtn').textContent = t('imPrefix') + nameOf(state.idx);
    const av = $('passAvatar');
    paintAvatar(av, state.idx);
    av.style.animation = 'none'; void av.offsetWidth; av.style.animation = '';
    show('scr-pass', dir);
  }

  function showCard() {
    $('cardStep').textContent = t('stepOf')(state.idx + 1, state.players.length);

    const flip = $('flip');
    flip.classList.remove('flipped');
    $('doneBtn').classList.add('veil');

    const c = colorOf(state.idx);
    $('cardBack').style.background = 'linear-gradient(150deg, ' + c + ', ' + shade(c, -25) + ')';
    $('cbName').textContent = nameOf(state.idx);

    const front = $('cardFront');
    front.innerHTML = '';
    front.className = 'face front';   // "front" carries the rotateY that makes the flip work
    if (state.roles[state.idx]) {
      front.classList.add('imp');
      const a = document.createElement('div');
      a.className = 'imptitle';
      a.textContent = t('imposterTitle');
      const b = document.createElement('div');
      b.className = 'impsub';
      b.textContent = t('imposterSub');
      front.appendChild(a); front.appendChild(b);
    } else {
      front.classList.add('word');
      const a = document.createElement('div');
      a.className = 'catchip';
      a.textContent = state.cat[state.lang];
      const b = document.createElement('div');
      b.className = 'theword';
      b.textContent = state.word[state.lang === 'ar' ? 0 : 1];
      front.appendChild(a); front.appendChild(b);
    }
    show('scr-card', 1);
  }

  function flipCard() {
    const flip = $('flip');
    if (flip.classList.contains('flipped')) return;
    flip.classList.add('flipped');
    buzz(state.roles[state.idx] ? [55, 55, 55] : 35);
    setTimeout(() => $('doneBtn').classList.remove('veil'), 340);
  }

  function showStarter() {
    $('starterName').textContent = nameOf(state.starter);
    $('starterName').style.color = colorOf(state.starter);
    const av = $('starterAvatar');
    paintAvatar(av, state.starter);
    av.style.animation = 'none'; void av.offsetWidth; av.style.animation = '';
    show('scr-starter', 1);
  }

  /* ---------------- timer ---------------- */
  let tick = null, endAt = 0;

  function fmt(s) {
    if (s < 0) s = 0;
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  function startPlay() {
    const el = $('timerEl');
    el.classList.remove('done');
    stopTimer();
    if (state.timerMin > 0) {
      $('playHint').textContent = t('playHintTimer');
      const total = state.timerMin * 60;
      endAt = Date.now() + total * 1000;
      el.textContent = fmt(total);
      tick = setInterval(() => {
        const left = Math.ceil((endAt - Date.now()) / 1000);
        if (left <= 0) {
          stopTimer();
          el.textContent = t('timeUp');
          el.classList.add('done');
          buzz([200, 100, 200]);
        } else {
          el.textContent = fmt(left);
        }
      }, 250);
    } else {
      $('playHint').textContent = t('playHintNoTimer');
      el.textContent = '∞';
    }
    show('scr-play', 1);
  }

  function doReveal() {
    stopTimer();
    const names = [];
    state.roles.forEach((isImp, i) => { if (isImp) names.push(nameOf(i)); });
    $('impPanelLbl').textContent = names.length > 1 ? t('theImpostersWere') : t('theImposterWas');
    $('impPanelVal').textContent = names.join(t('andJoin'));
    $('wordPanelVal').textContent = state.word[state.lang === 'ar' ? 0 : 1];
    buzz([80, 60, 80, 60, 160]);
    show('scr-reveal', 1);
  }

  /* ---------------- sheets ---------------- */
  let pendingYes = null;

  function askConfirm(msgKey, yesKey, onYes) {
    $('sheetMsg').textContent = t(msgKey);
    $('confirmYes').textContent = t(yesKey);
    pendingYes = onYes;
    $('confirmSheet').classList.add('on');
  }
  function closeSheet() { $('confirmSheet').classList.remove('on'); pendingYes = null; }

  /* ---------------- wiring ---------------- */
  function toggleLang() {
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    save(); applyLang();
  }
  $('langBtn').addEventListener('click', toggleLang);
  $('homeLang').addEventListener('click', toggleLang);

  $('homePlay').addEventListener('click', () => show('scr-setup', 1));
  $('setupBack').addEventListener('click', () => show('scr-home', -1));
  $('howBtn').addEventListener('click', () => $('howSheet').classList.add('on'));
  $('howClose').addEventListener('click', () => $('howSheet').classList.remove('on'));
  $('howSheet').addEventListener('click', e => {
    if (e.target === $('howSheet')) $('howSheet').classList.remove('on');
  });

  $('addBtn').addEventListener('click', () => {
    if (state.players.length >= MAX_PLAYERS) return;
    state.players.push('');
    save(); renderPlayers(); renderSegs(); validate();
  });

  $('catAll').addEventListener('click', () => {
    state.cats = CATEGORIES.map(c => c.id);
    save(); renderCats(); validate();
  });
  $('catNone').addEventListener('click', () => {
    state.cats = [];
    save(); renderCats(); validate();
  });

  $('impSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    state.imposters = +b.dataset.v;
    save(); renderSegs(); validate();
  });

  $('timerSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.timerMin = +b.dataset.v;
    save(); renderSegs();
  });

  $('startBtn').addEventListener('click', () => {
    if ($('startBtn').disabled) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    deal(); showPass(1);
  });

  $('imBtn').addEventListener('click', showCard);
  $('flip').addEventListener('click', flipCard);

  $('doneBtn').addEventListener('click', () => {
    if ($('doneBtn').classList.contains('veil')) return;
    state.idx++;
    if (state.idx >= state.players.length) showStarter(); else showPass(1);
  });

  $('playBtn').addEventListener('click', startPlay);

  function backToSetup() { stopTimer(); show('scr-setup', -1); }

  $('revealBtn').addEventListener('click', () => askConfirm('confirmReveal', 'yesReveal', doReveal));
  $('exitBtn').addEventListener('click', () => askConfirm('confirmExit', 'yesExit', backToSetup));
  $('confirmNo').addEventListener('click', closeSheet);
  $('confirmYes').addEventListener('click', () => {
    const fn = pendingYes;
    closeSheet();
    if (fn) fn();
  });

  $('againBtn').addEventListener('click', () => { deal(); showPass(1); });
  $('backBtn').addEventListener('click', backToSetup);

  /* ---------------- boot ---------------- */
  load();
  applyLang();
})();
</script>
</body>
</html>
