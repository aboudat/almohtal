<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="المحتال - لعبة جماعية بجهاز واحد. مرر الجهاز، اكتشف المحتال.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>المحتال</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg:#f4f5fa;
    --surface:#ffffff;
    --sunken:#f0f0f6;
    --ink:#14121f;
    --dim:#75748e;
    --faint:#b9b9cb;
    --line:#e5e6f0;
    --disabled:#d9dae6;
    --brand:#6d3bf5;
    --brand-2:#8b5cff;
    --brand-soft:#f0eaff;
    --danger:#ff3355;
    --danger-2:#ff5f7a;
    --scrim:rgba(20,18,31,.42);
    --sh-sm: 0 1px 2px rgba(20,18,31,.06), 0 3px 10px rgba(20,18,31,.05);
    --sh-md: 0 2px 6px rgba(20,18,31,.07), 0 14px 34px rgba(20,18,31,.10);
    --sh-brand: 0 6px 18px rgba(109,59,245,.34);
    --sh-danger: 0 6px 18px rgba(255,51,85,.30);

    --maxw: 480px;
    --sx: 100%;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  :root[data-theme="dark"] {
    --bg:#0f0f16;
    --surface:#1a1a26;
    --sunken:#23232f;
    --ink:#f1f0f8;
    --dim:#9b99b4;
    --faint:#5d5b78;
    --line:#2b2b3b;
    --disabled:#33334a;
    --brand:#8b5cff;
    --brand-2:#a682ff;
    --brand-soft:#251e42;
    --danger:#ff4d6a;
    --danger-2:#ff7189;
    --scrim:rgba(0,0,0,.62);
    --sh-sm: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.3);
    --sh-md: 0 2px 6px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.45);
    --sh-brand: 0 6px 18px rgba(139,92,255,.34);
    --sh-danger: 0 6px 18px rgba(255,77,106,.30);
  }
  [dir="rtl"] { --sx: -100%; }

  html, body {
    width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family: system-ui, 'Segoe UI', 'Noto Sans Arabic', Tahoma, sans-serif;
    user-select:none; -webkit-user-select:none;
    /* no colour transition here: .screen repaints its background instantly, so a slow
       body colour fade leaves dark text on a dark ground for a frame or two */
  }

  /* ---------------- screens and transitions ---------------- */
  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg);
    visibility:hidden; opacity:0; transform:translateX(0) scale(.98);
    transition: transform .34s cubic-bezier(.33,.7,.2,1), opacity .26s ease;
  }
  .screen.on   { visibility:visible; opacity:1; transform:none; z-index:2; }
  .screen.pre-f{ visibility:visible; opacity:0; transform:translateX(var(--sx)); transition:none; }
  .screen.pre-b{ visibility:visible; opacity:0; transform:translateX(calc(var(--sx) * -1)); transition:none; }
  .screen.out-f{ visibility:visible; opacity:0; transform:translateX(calc(var(--sx) * -.26)) scale(.97); z-index:1; }
  .screen.out-b{ visibility:visible; opacity:0; transform:translateX(calc(var(--sx) * .26)) scale(.97); z-index:1; }

  /* everything sits in a centred column so wide screens stay readable */
  .top, .scroll, .bot, .mid, .hdr { width:100%; max-width:var(--maxw); margin-inline:auto; }

  /* ---------------- chrome ---------------- */
  .top { display:flex; align-items:center; gap:10px; flex:0 0 auto;
         padding:calc(14px + var(--safe-t)) 16px 8px; }
  .top h2 { font-size:19px; font-weight:800; flex:1 1 auto; }
  .hdr { display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;
         padding:calc(16px + var(--safe-t)) 18px 0; min-height:44px; }
  .step { font-size:14px; color:var(--dim); font-weight:800; }
  .exit { background:none; border:none; color:var(--faint); font-family:inherit; font-size:28px;
          line-height:1; padding:4px 10px; cursor:pointer; }
  .exit:active { color:var(--danger); }
  .icon-btn { flex:0 0 auto; width:42px; height:42px; border-radius:14px; background:var(--surface);
              border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:19px;
              font-weight:700; cursor:pointer; box-shadow:var(--sh-sm); line-height:1; }
  .icon-btn:active { transform:scale(.94); }
  .lang { flex:0 0 auto; height:42px; min-width:52px; padding:0 15px; border-radius:14px;
          background:var(--surface); border:1px solid var(--line); color:var(--brand);
          font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; box-shadow:var(--sh-sm); }
  .lang:active { transform:scale(.94); }

  .scroll { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 24px; }
  .bot { flex:0 0 auto; padding:10px 16px calc(14px + var(--safe-b)); }

  /* ---------------- buttons ---------------- */
  .primary, .danger, .quiet {
    width:100%; font-family:inherit; font-size:20px; font-weight:800; padding:18px;
    border:none; border-radius:18px; cursor:pointer; transition:transform .12s ease, opacity .2s ease;
  }
  .primary { background:linear-gradient(135deg, var(--brand-2), var(--brand)); color:#fff;
             box-shadow:var(--sh-brand); }
  .primary:active { transform:scale(.975); }
  .primary:disabled { background:var(--disabled); color:var(--surface); box-shadow:none; transform:none; }
  .danger { background:linear-gradient(135deg, var(--danger-2), var(--danger)); color:#fff;
            box-shadow:var(--sh-danger); }
  .danger:active { transform:scale(.975); }
  .quiet { background:var(--surface); border:1px solid var(--line); color:var(--dim);
           font-size:17px; padding:16px; box-shadow:var(--sh-sm); }
  .quiet:active { transform:scale(.975); }
  .bot .quiet { margin-top:10px; }
  .link { display:block; width:100%; background:none; border:none; color:var(--dim);
          font-family:inherit; font-size:15px; font-weight:700; padding:14px; cursor:pointer; margin-top:2px; }
  .link:active { color:var(--brand); }
  .veil { opacity:0; pointer-events:none; }

  /* ---------------- home ---------------- */
  .home { flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; padding:24px; gap:6px; }
  .logo { width:132px; height:132px; margin-bottom:10px;
          filter:drop-shadow(0 14px 26px rgba(109,59,245,.30)); animation:pop .5s cubic-bezier(.2,1.3,.4,1) both; }
  .home-title { font-size:48px; font-weight:900; letter-spacing:-.5px;
                animation:rise .45s .08s cubic-bezier(.2,.9,.3,1) both; }
  .home-tag { font-size:17px; color:var(--dim); font-weight:600; max-width:280px; line-height:1.6;
              animation:rise .45s .16s cubic-bezier(.2,.9,.3,1) both; }
  #scr-home .bot { animation:rise .45s .24s cubic-bezier(.2,.9,.3,1) both; }
  .home-tools { position:absolute; top:calc(14px + var(--safe-t)); inset-inline-end:16px;
                display:flex; gap:8px; }
  @keyframes pop  { from { opacity:0; transform:scale(.7) rotate(-8deg); } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }

  /* ---------------- setup ---------------- */
  .lead { color:var(--dim); font-size:15px; line-height:1.6; margin:2px 0 16px; }
  .sec { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:24px 0 10px; }
  .sec h3 { font-size:13px; font-weight:800; color:var(--dim); letter-spacing:1.2px; text-transform:uppercase; }
  .sec .mini { display:flex; gap:6px; }
  .mini button { background:none; border:none; color:var(--brand); font-family:inherit;
                 font-size:13px; font-weight:800; padding:5px 8px; border-radius:8px; cursor:pointer; }
  .mini button:active { background:var(--brand-soft); }

  .prow { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .dot { flex:0 0 38px; height:38px; border-radius:13px; color:#fff; font-size:15px; font-weight:800;
         display:flex; align-items:center; justify-content:center; }
  .prow input {
    flex:1 1 auto; min-width:0; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-size:17px; font-weight:600; font-family:inherit; padding:14px; border-radius:14px;
    outline:none; box-shadow:var(--sh-sm); transition:border-color .18s ease;
  }
  .prow input:focus { border-color:var(--brand); }
  .prow input::placeholder { color:var(--faint); font-weight:500; }
  .prow .del { flex:0 0 40px; height:44px; background:none; border:none; color:var(--faint);
               font-size:24px; cursor:pointer; line-height:1; font-family:inherit; }
  .prow .del:active { color:var(--danger); }
  .prow .del:disabled { opacity:.35; }

  .ghost { width:100%; background:var(--brand-soft); border:none; color:var(--brand);
           font-family:inherit; font-size:16px; font-weight:800; padding:15px; border-radius:14px;
           cursor:pointer; margin-top:4px; }
  .ghost:active { transform:scale(.98); }
  .ghost:disabled { opacity:.4; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
         background:var(--surface); border:1px solid var(--line); border-radius:16px;
         padding:12px 14px; margin-bottom:10px; box-shadow:var(--sh-sm); }
  .row.off { opacity:.45; }
  .rowtext { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .rowtext > span { font-size:16px; font-weight:700; }
  .rowtext > small { font-size:12.5px; font-weight:600; color:var(--dim); line-height:1.4; }
  .seg { display:flex; gap:5px; flex:0 0 auto; background:var(--sunken); padding:4px; border-radius:12px; }
  .seg button { background:none; border:none; color:var(--dim); font-family:inherit;
                font-size:15px; font-weight:800; padding:8px 12px; border-radius:9px; cursor:pointer;
                min-width:42px; transition:background .16s ease, color .16s ease; }
  .seg button.on { background:var(--surface); color:var(--brand); box-shadow:var(--sh-sm); }
  .seg button:disabled { opacity:.35; }

  /* switch */
  .sw { flex:0 0 auto; width:54px; height:32px; border-radius:999px; background:var(--sunken);
        border:none; cursor:pointer; position:relative; transition:background .2s ease; }
  .sw::after { content:''; position:absolute; top:4px; inset-inline-start:4px; width:24px; height:24px;
               border-radius:50%; background:var(--surface); box-shadow:var(--sh-sm);
               transition:transform .2s cubic-bezier(.3,.9,.3,1); }
  .sw.on { background:var(--brand); }
  .sw.on::after { transform:translateX(calc(22px * var(--dirmul, 1))); }
  [dir="rtl"] .sw { --dirmul: -1; }
  .sw:disabled { opacity:.4; cursor:default; }

  .cats { display:flex; flex-wrap:wrap; gap:8px; }
  .cats button { background:var(--surface); border:1px solid var(--line); color:var(--dim);
                 font-family:inherit; font-size:15px; font-weight:700; padding:11px 15px;
                 border-radius:999px; cursor:pointer; box-shadow:var(--sh-sm);
                 transition:transform .12s ease, background .16s ease, color .16s ease, border-color .16s ease; }
  .cats button.on { background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:var(--sh-brand); }
  .cats button:active { transform:scale(.95); }
  .cats button i { font-style:normal; opacity:.6; font-size:13px; margin-inline-start:5px; }

  .warn { color:var(--danger); font-size:14px; font-weight:700; margin-top:14px; min-height:20px; line-height:1.5; }

  /* ---------------- pass ---------------- */
  .mid { flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
         justify-content:center; text-align:center; padding:20px; gap:14px; }
  .avatar { width:96px; height:96px; border-radius:34px; color:#fff; font-size:40px; font-weight:900;
            display:flex; align-items:center; justify-content:center; margin-bottom:4px;
            animation:pop .42s cubic-bezier(.2,1.3,.4,1) both; }
  .kicker { font-size:16px; color:var(--dim); font-weight:700; }
  .bigname { font-size:40px; font-weight:900; line-height:1.2; word-break:break-word; }
  .hint { font-size:15px; color:var(--dim); line-height:1.6; max-width:320px; font-weight:600; }
  .dots { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--line); transition:all .2s ease; }
  .dots i.done { background:var(--brand); opacity:.45; }
  .dots i.now { background:var(--brand); width:20px; border-radius:999px; }

  /* ---------------- flip card ---------------- */
  .flip { width:100%; max-width:330px; height:clamp(300px, 52vh, 430px); perspective:1500px; cursor:pointer; }
  .flip-in { position:relative; width:100%; height:100%; transform-style:preserve-3d;
             transition:transform .62s cubic-bezier(.4,.02,.2,1); }
  .flip.flipped .flip-in { transform:rotateY(180deg); }
  .flip:active .flip-in { transform:scale(.97); }
  .flip.flipped:active .flip-in { transform:rotateY(180deg) scale(.97); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
          border-radius:28px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; padding:26px; gap:10px; box-shadow:var(--sh-md); }
  .face.front { transform:rotateY(180deg); }
  .cb-mark { position:absolute; width:74%; left:13%; top:50%; transform:translateY(-56%); pointer-events:none; }
  .cb-name { font-size:26px; font-weight:900; color:#fff; }
  .cb-hint { font-size:15px; font-weight:700; color:rgba(255,255,255,.85); }
  .face.word { background:var(--surface); border:1px solid var(--line); }
  .catchip { font-size:14px; font-weight:800; color:var(--brand); background:var(--brand-soft);
             padding:7px 14px; border-radius:999px; }
  .theword { font-size:36px; font-weight:900; line-height:1.25; word-break:break-word; }
  .wordsub { font-size:16px; font-weight:700; color:var(--dim); direction:ltr; margin-top:-4px; }
  .face.imp { background:linear-gradient(150deg, var(--danger-2), var(--danger)); }
  .imptitle { font-size:34px; font-weight:900; color:#fff; line-height:1.25; }
  .impsub { font-size:15px; font-weight:600; color:rgba(255,255,255,.9); line-height:1.6; }
  .impchip { font-size:14px; font-weight:800; color:#fff; background:rgba(255,255,255,.22);
             padding:7px 14px; border-radius:999px; }
  .partner { background:rgba(255,255,255,.16); border-radius:14px; padding:11px 16px; }
  .partner b { display:block; font-size:12.5px; font-weight:800; color:rgba(255,255,255,.8);
               letter-spacing:.8px; margin-bottom:3px; }
  .partner span { font-size:19px; font-weight:900; color:#fff; }

  /* ---------------- play ---------------- */
  .timer { font-size:70px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:1px; direction:ltr; }
  .timer.done { color:var(--danger); font-size:44px; }
  .timer.paused { opacity:.45; }
  .tctl { display:flex; gap:10px; }
  .tctl button { background:var(--surface); border:1px solid var(--line); color:var(--dim);
                 font-family:inherit; font-size:14px; font-weight:800; padding:11px 18px;
                 border-radius:999px; cursor:pointer; box-shadow:var(--sh-sm); }
  .tctl button:active { transform:scale(.95); }

  /* ---------------- reveal ---------------- */
  .revealbox { width:100%; max-width:340px; display:flex; flex-direction:column; gap:14px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px;
           box-shadow:var(--sh-sm); animation:rise .4s cubic-bezier(.2,.9,.3,1) both; }
  .panel.red { background:linear-gradient(150deg, var(--danger-2), var(--danger)); border:none;
               box-shadow:var(--sh-danger); }
  .panel:nth-child(2) { animation-delay:.1s; }
  .plbl { font-size:13px; font-weight:800; color:var(--dim); letter-spacing:1.2px; margin-bottom:7px; }
  .panel.red .plbl { color:rgba(255,255,255,.85); }
  .pval { font-size:28px; font-weight:900; line-height:1.35; word-break:break-word; }
  .panel.red .pval { color:#fff; }
  .psub { font-size:15px; font-weight:700; color:var(--dim); direction:ltr; margin-top:4px; }

  /* ---------------- sheets ---------------- */
  .sheet { position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(3px);
           display:flex; align-items:flex-end; justify-content:center; padding:14px;
           padding-bottom:calc(14px + var(--safe-b)); z-index:50;
           opacity:0; pointer-events:none; transition:opacity .24s ease; }
  .sheet.on { opacity:1; pointer-events:auto; }
  .sheet .box { width:100%; max-width:420px; background:var(--surface); border-radius:26px; padding:24px;
                text-align:center; box-shadow:var(--sh-md);
                transform:translateY(18px); transition:transform .3s cubic-bezier(.2,.9,.3,1); }
  .sheet.on .box { transform:none; }
  .sheet .box p { font-size:18px; font-weight:700; line-height:1.6; margin-bottom:18px; }
  .sheet h3 { font-size:22px; font-weight:900; margin-bottom:16px; }
  .steps { text-align:start; display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
  .stepline { display:flex; gap:12px; align-items:flex-start; }
  .stepline b { flex:0 0 28px; height:28px; border-radius:10px; background:var(--brand-soft);
                color:var(--brand); font-size:14px; font-weight:900;
                display:flex; align-items:center; justify-content:center; }
  .stepline span { font-size:15px; font-weight:600; line-height:1.55; color:var(--ink); }

  /* ---------------- splash ---------------- */
  #scr-splash { background:var(--bg); }
  .splash { flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:2px; padding:24px; text-align:center; }
  .splash-logo { width:150px; height:150px; margin-bottom:14px; overflow:visible; }
  .splash-logo .ink { stroke-dasharray:1; stroke-dashoffset:1;
                      animation:draw .85s cubic-bezier(.55,0,.25,1) .12s forwards; }
  .splash-logo .solid { opacity:0; transform-origin:50% 50%;
                        animation:solidIn .5s cubic-bezier(.2,1.3,.4,1) .82s forwards; }
  .splash-logo .glow { opacity:0; animation:glowPulse 1.1s ease .9s forwards; }
  @keyframes draw     { to { stroke-dashoffset:0; } }
  @keyframes solidIn  { from { opacity:0; transform:scale(.82); } to { opacity:1; transform:scale(1); } }
  @keyframes glowPulse{ 0% { opacity:0; transform:scale(.7);} 45% { opacity:.5; } 100% { opacity:0; transform:scale(1.45);} }

  .wm-ar { font-size:46px; font-weight:900; letter-spacing:-.5px; color:var(--ink);
           animation:rise .5s 1.05s cubic-bezier(.2,.9,.3,1) both; }
  .wm-en { font-size:15px; font-weight:800; letter-spacing:7px; color:var(--brand);
           direction:ltr; margin-top:2px;
           animation:rise .5s 1.2s cubic-bezier(.2,.9,.3,1) both; }
  .wm-rule { width:0; height:2px; border-radius:2px; margin:16px 0 12px;
             background:linear-gradient(90deg, transparent, var(--brand), transparent);
             animation:ruleGrow .55s 1.32s cubic-bezier(.3,.9,.3,1) forwards; }
  @keyframes ruleGrow { to { width:150px; } }
  .wm-by { font-size:13px; font-weight:700; letter-spacing:2px; color:var(--dim); direction:ltr;
           animation:rise .5s 1.5s cubic-bezier(.2,.9,.3,1) both; }
  .splash-skip { position:absolute; bottom:calc(22px + var(--safe-b)); inset-inline:0;
                 font-size:12.5px; font-weight:700; color:var(--faint); letter-spacing:1px;
                 text-align:center;
                 animation:rise .5s 1.9s ease both; }

  /* ---------------- dealing the cards ---------------- */
  .deal { position:fixed; inset:0; z-index:40; background:var(--bg);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
          opacity:0; pointer-events:none; transition:opacity .28s ease; }
  .deal.run { opacity:1; pointer-events:auto; transition:none; }
  .deal-stack { position:relative; width:150px; height:112px; }
  .deal-stack i { position:absolute; inset:0; margin:auto; width:62px; height:88px; border-radius:11px;
                  background:linear-gradient(150deg, var(--brand-2), var(--brand));
                  box-shadow:var(--sh-md); opacity:0; }
  .deal.run .deal-stack i { animation:dealOut .72s cubic-bezier(.25,1.1,.35,1) forwards; }
  .deal.run .deal-stack i:nth-child(1) { --tx:-58px; --rot:-20deg; animation-delay:0s; }
  .deal.run .deal-stack i:nth-child(2) { --tx:-29px; --rot:-10deg; animation-delay:.07s; }
  .deal.run .deal-stack i:nth-child(3) { --tx:0px;   --rot:0deg;   animation-delay:.14s; }
  .deal.run .deal-stack i:nth-child(4) { --tx:29px;  --rot:10deg;  animation-delay:.21s; }
  .deal.run .deal-stack i:nth-child(5) { --tx:58px;  --rot:20deg;  animation-delay:.28s; }
  @keyframes dealOut {
    0%   { opacity:0; transform:translate(0,26px) rotate(0deg) scale(.86); }
    55%  { opacity:1; }
    100% { opacity:1; transform:translate(var(--tx),0) rotate(var(--rot)) scale(1); }
  }
  .deal-text { font-size:17px; font-weight:800; color:var(--dim); letter-spacing:1px; }
  .deal.run .deal-text { animation:rise .4s .3s ease both; }

  /* ---------------- imposter reveal ---------------- */
  .panel { position:relative; }
  .panel.red.stamp { animation:stampIn .52s cubic-bezier(.2,1.5,.35,1) both; }
  @keyframes stampIn {
    0%   { opacity:0; transform:scale(1.32) rotate(-2.5deg); }

  /* ---------------- state ---------------- */
  const KEY = 'almohtal.v1';
  const MIN_PLAYERS = 3, MAX_PLAYERS = 12, TWO_IMP_MIN = 7, RECENT_MAX = 40;

  const state = {
    lang:'ar',
    theme:'auto',
    players:['', '', ''],
    imposters:1,
    partners:true,
    hint:false,
    timerMin:3,
    cats:CATEGORIES.map(c => c.id),
    recent:[],
    round:0,
    roles:[], word:null, cat:null, idx:0, starter:0
  };

  const t = k => STR[state.lang][k];
  const $ = id => document.getElementById(id);
  const colorOf = i => COLORS[i % COLORS.length];

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!d) return;
      if (d.lang === 'ar' || d.lang === 'en') state.lang = d.lang;
      if (['light','dark','auto'].indexOf(d.theme) >= 0) state.theme = d.theme;
      if (Array.isArray(d.players) && d.players.length >= MIN_PLAYERS)
        state.players = d.players.slice(0, MAX_PLAYERS).map(String);
      if (d.imposters === 1 || d.imposters === 2) state.imposters = d.imposters;
      if (typeof d.partners === 'boolean') state.partners = d.partners;
      if (typeof d.hint === 'boolean') state.hint = d.hint;
      if ([0, 2, 3, 5].indexOf(d.timerMin) >= 0) state.timerMin = d.timerMin;
      if (Array.isArray(d.cats)) {
        const valid = d.cats.filter(id => CATEGORIES.some(c => c.id === id));
        if (valid.length) state.cats = valid;
      }
      if (Array.isArray(d.recent)) state.recent = d.recent.slice(-RECENT_MAX).map(String);
    } catch (e) {}
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        lang:state.lang, theme:state.theme, players:state.players,
        imposters:state.imposters, partners:state.partners, hint:state.hint,
        timerMin:state.timerMin, cats:state.cats, recent:state.recent
      }));
    } catch (e) {}
  }

  /* ---------------- helpers ---------------- */
  function rand(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      const a = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / n) * n;   // reject the tail so modulo stays uniform
      do { window.crypto.getRandomValues(a); } while (a[0] >= limit);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function pickDistinct(count, n) {
    const pool = [];
    for (let i = 0; i < n; i++) pool.push(i);
    const out = [];
    for (let i = 0; i < count && pool.length; i++) out.push(pool.splice(rand(pool.length), 1)[0]);
    return out;
  }

  function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

  function nameOf(i) {
    const raw = (state.players[i] || '').trim();
    return raw || (t('defPlayer') + ' ' + (i + 1));
  }

  // darken or lighten a hex colour by a percentage
  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    const f = (c) => Math.max(0, Math.min(255, Math.round(c + (c * pct / 100))));
    return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)]
      .map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function paintAvatar(el, i) {
    el.style.background = 'linear-gradient(150deg, ' + colorOf(i) + ', ' + shade(colorOf(i), -22) + ')';
    el.textContent = nameOf(i).charAt(0);
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }

  // the word as shown, plus the original name when the Arabic is a transliteration
  function wordMain() { return state.word[state.lang === 'ar' ? 0 : 1]; }
  function wordSub()  { return (state.cat.latin && state.lang === 'ar') ? state.word[1] : ''; }

  /* ---------------- theme ---------------- */
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function resolvedTheme() {
    if (state.theme === 'auto') return (darkQuery && darkQuery.matches) ? 'dark' : 'light';
    return state.theme;
  }
  function applyTheme() {
    const th = resolvedTheme();
    const root = document.documentElement;
    if (root.getAttribute('data-theme') !== th) {
      root.classList.add('theming');
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theming')));
    }
    root.setAttribute('data-theme', th);
    $('themeColor').setAttribute('content', th === 'dark' ? '#0f0f16' : '#ffffff');
    $('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
    $('themeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === state.theme));
  }
  if (darkQuery && darkQuery.addEventListener) {
    darkQuery.addEventListener('change', () => { if (state.theme === 'auto') applyTheme(); });
  }

  /* ---------------- screen transitions ---------------- */
  function show(id, dir) {
    const next = $(id);
    const cur = document.querySelector('.screen.on');
    if (!cur) { next.classList.add('on'); return; }
    if (cur === next) return;
    const back = dir === -1;
    next.classList.add(back ? 'pre-b' : 'pre-f');
    void next.offsetWidth;                       // commit the offscreen position first
    next.classList.remove('pre-b', 'pre-f');
    next.classList.add('on');
    cur.classList.remove('on');
    cur.classList.add(back ? 'out-b' : 'out-f');
    setTimeout(() => cur.classList.remove('out-b', 'out-f'), 420);
  }

  /* ---------------- language ---------------- */
  function applyLang() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('brand');
    $('homeTitle').textContent = t('brand');
    $('setupBack').textContent = t('backArrow');
    const label = state.lang === 'ar' ? 'EN' : 'ع';
    $('langBtn').textContent = label;
    $('homeLang').textContent = label;
    document.querySelectorAll('[data-t]').forEach(el => {
      const v = STR[state.lang][el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    $('addMinBtn').textContent = t('addMin');
    renderHow();
    renderPlayers();
    renderCats();
    renderSegs();
    validate();
  }

  function renderHow() {
    const box = $('howSteps');
    box.innerHTML = '';
    t('steps').forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'stepline';
      const b = document.createElement('b');
      b.textContent = i + 1;
      const span = document.createElement('span');
      span.textContent = s;
      row.appendChild(b); row.appendChild(span);
      box.appendChild(row);
    });
  }

  /* ---------------- setup rendering ---------------- */
  function renderPlayers() {
    const list = $('playerList');
    list.innerHTML = '';
    state.players.forEach((val, i) => {
      const row = document.createElement('div');
      row.className = 'prow';

      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = colorOf(i);
      dot.textContent = i + 1;

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = val;
      inp.maxLength = 16;
      inp.autocomplete = 'off';
      inp.placeholder = t('defPlayer') + ' ' + (i + 1);
      inp.addEventListener('input', () => { state.players[i] = inp.value; save(); });

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.disabled = state.players.length <= MIN_PLAYERS;
      del.addEventListener('click', () => {
        if (state.players.length <= MIN_PLAYERS) return;
        state.players.splice(i, 1);
        save(); renderPlayers(); renderSegs(); validate();
      });

      row.appendChild(dot); row.appendChild(inp); row.appendChild(del);
      list.appendChild(row);
    });
    $('addBtn').disabled = state.players.length >= MAX_PLAYERS;
  }

  function renderCats() {
    const box = $('catList');
    box.innerHTML = '';
    CATEGORIES.forEach(c => {
      const b = document.createElement('button');
      b.textContent = c[state.lang];
      const n = document.createElement('i');
      n.textContent = c.words.length;
      b.appendChild(n);
      if (state.cats.indexOf(c.id) >= 0) b.classList.add('on');
      b.addEventListener('click', () => {
        const at = state.cats.indexOf(c.id);
        if (at >= 0) state.cats.splice(at, 1); else state.cats.push(c.id);
        b.classList.toggle('on');
        save(); validate();
      });
      box.appendChild(b);
    });
  }

  function renderSegs() {
    const twoOk = state.players.length >= TWO_IMP_MIN;
    if (!twoOk) state.imposters = 1;
    $('impSeg').querySelectorAll('button').forEach(b => {
      const v = +b.dataset.v;
      b.disabled = (v === 2 && !twoOk);
      b.classList.toggle('on', v === state.imposters);
    });
    $('timerSeg').querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', +b.dataset.v === state.timerMin);
    });
    // the partner switch only means anything with two imposters
    const canPartner = state.imposters === 2;
    $('swPartners').classList.toggle('on', state.partners && canPartner);
    $('swPartners').disabled = !canPartner;
    $('rowPartners').classList.toggle('off', !canPartner);
    $('swHint').classList.toggle('on', state.hint);
    applyTheme();
  }

  function validate() {
    const warn = [];
    if (state.players.length < MIN_PLAYERS) warn.push(t('warnMin'));
    if (state.cats.length === 0) warn.push(t('warnCat'));
    if (state.imposters === 2 && state.players.length < TWO_IMP_MIN) warn.push(t('warnImp'));
    $('setupWarn').textContent = warn.join(' ');
    $('startBtn').disabled = warn.length > 0;
  }

  /* ---------------- round flow ---------------- */
  function deal() {
    // draw uniformly across every enabled word, skipping anything played recently
    const pool = [];
    CATEGORIES.forEach(c => {
      if (state.cats.indexOf(c.id) < 0) return;
      c.words.forEach(w => pool.push({ cat:c, word:w, key:c.id + '|' + w[1] }));
    });
    let fresh = pool.filter(p => state.recent.indexOf(p.key) < 0);
    if (!fresh.length) { state.recent = []; fresh = pool; }
    const pick = fresh[rand(fresh.length)];
    state.cat = pick.cat;
    state.word = pick.word;
    state.recent.push(pick.key);
    while (state.recent.length > RECENT_MAX) state.recent.shift();

    const n = state.players.length;
    const k = Math.max(1, Math.min(state.imposters, n - 2));   // always leave two who know the word
    state.roles = new Array(n).fill(false);
    pickDistinct(k, n).forEach(i => { state.roles[i] = true; });

    state.starter = rand(n);
    state.idx = 0;
    state.round++;
    save();
  }

  function impostorIndexes() {
    const out = [];
    state.roles.forEach((v, i) => { if (v) out.push(i); });
    return out;
  }

  function renderDots() {
    const box = $('passDots');
    box.innerHTML = '';
    for (let i = 0; i < state.players.length; i++) {
      const d = document.createElement('i');
      if (i < state.idx) d.className = 'done';
      else if (i === state.idx) d.className = 'now';
      box.appendChild(d);
    }
  }

  function showPass(dir) {
    $('passStep').textContent = t('stepOf')(state.idx + 1, state.players.length);
    $('passName').textContent = nameOf(state.idx);
    $('passName').style.color = colorOf(state.idx);
    $('imBtn').textContent = t('imPrefix') + nameOf(state.idx);
    paintAvatar($('passAvatar'), state.idx);
    renderDots();
    show('scr-pass', dir);
  }

  function showCard() {
    $('cardStep').textContent = t('stepOf')(state.idx + 1, state.players.length);

    const flip = $('flip');
    flip.classList.remove('flipped');
    $('doneBtn').classList.add('veil');

    const c = colorOf(state.idx);
    $('cardBack').style.background = 'linear-gradient(150deg, ' + c + ', ' + shade(c, -25) + ')';
    $('cbName').textContent = nameOf(state.idx);

    const front = $('cardFront');
    front.innerHTML = '';
    front.className = 'face front';   // "front" carries the rotateY that makes the flip work

    const add = (cls, text, tag) => {
      const el = document.createElement(tag || 'div');
      el.className = cls;
      el.textContent = text;
      front.appendChild(el);
      return el;
    };

    if (state.roles[state.idx]) {
      front.classList.add('imp');
      add('imptitle', t('imposterTitle'));
      if (state.hint) add('impchip', state.cat[state.lang]);

      const others = impostorIndexes().filter(i => i !== state.idx);
      if (state.partners && others.length) {
        const box = document.createElement('div');
        box.className = 'partner';
        const b = document.createElement('b');
        b.textContent = t('partnerLbl');
        const s = document.createElement('span');
        s.textContent = others.map(nameOf).join(t('andJoin'));
        box.appendChild(b); box.appendChild(s);
        front.appendChild(box);
      }
      add('impsub', t('imposterSub'));
    } else {
      front.classList.add('word');
      add('catchip', state.cat[state.lang]);
      add('theword', wordMain());
      const sub = wordSub();
      if (sub) add('wordsub', sub);
    }
    show('scr-card', 1);
  }

  function flipCard() {
    const flip = $('flip');
    if (flip.classList.contains('flipped')) return;
    flip.classList.add('flipped');
    buzz(state.roles[state.idx] ? [55, 55, 55] : 35);
    setTimeout(() => $('doneBtn').classList.remove('veil'), 340);
  }

  function showStarter() {
    $('starterName').textContent = nameOf(state.starter);
    $('starterName').style.color = colorOf(state.starter);
    paintAvatar($('starterAvatar'), state.starter);
    show('scr-starter', 1);
  }

  /* ---------------- keep the screen awake while the phone is on the table ------------- */
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on) {
        if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } else if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && $('scr-play').classList.contains('on')) keepAwake(true);
  });

  /* ---------------- timer ---------------- */
  let tick = null, endAt = 0, paused = false, leftPaused = 0;

  function fmt(s) {
    if (s < 0) s = 0;
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  function runTimer() {
    stopTimer();
    tick = setInterval(() => {
      const left = Math.ceil((endAt - Date.now()) / 1000);
      const el = $('timerEl');
      if (left <= 0) {
        stopTimer();
        el.textContent = t('timeUp');
        el.classList.add('done');
        $('tctl').classList.add('veil');
        buzz([200, 100, 200]);
      } else {
        el.textContent = fmt(left);
      }
    }, 250);
  }

  function setPauseLabel() { $('pauseBtn').textContent = paused ? t('resume') : t('pause'); }

  function startPlay() {
    const el = $('timerEl');
    el.classList.remove('done', 'paused');
    $('roundLbl').textContent = t('roundNo')(state.round);
    stopTimer();
    paused = false;
    setPauseLabel();
    keepAwake(true);

    if (state.timerMin > 0) {
      $('tctl').classList.remove('veil');
      $('playHint').textContent = t('playHintTimer');
      const total = state.timerMin * 60;
      endAt = Date.now() + total * 1000;
      el.textContent = fmt(total);
      runTimer();
    } else {
      $('tctl').classList.add('veil');
      $('playHint').textContent = t('playHintNoTimer');
      el.textContent = '∞';
    }
    show('scr-play', 1);
  }

  function togglePause() {
    if (state.timerMin === 0 || $('timerEl').classList.contains('done')) return;
    if (paused) {
      endAt = Date.now() + leftPaused;
      paused = false;
      $('timerEl').classList.remove('paused');
      runTimer();
    } else {
      leftPaused = Math.max(0, endAt - Date.now());
      paused = true;
      stopTimer();
      $('timerEl').classList.add('paused');
    }
    setPauseLabel();
  }

  function addMinute() {
    if (state.timerMin === 0) return;
    const el = $('timerEl');
    if (paused) { leftPaused += 60000; }
    else {
      if (el.classList.contains('done')) {     // revive an expired timer
        el.classList.remove('done');
        $('tctl').classList.remove('veil');
        endAt = Date.now();
      }
      endAt += 60000;
      runTimer();
      el.textContent = fmt(Math.ceil((endAt - Date.now()) / 1000));
    }
    buzz(25);
  }

  /* ---------------- flourishes ---------------- */
  const reduceMotion = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // fan the cards out before handing the phone to the first player
  function playDeal(then) {
    if (reduceMotion) { then(); return; }
    const fx = $('dealFx');
    fx.classList.remove('run');
    void fx.offsetWidth;              // restart the staggered card animations
    fx.classList.add('run');
    buzz(18);
    setTimeout(() => { then(); }, 880);            // pass screen renders behind the overlay
    setTimeout(() => fx.classList.remove('run'), 920);   // then it cross-fades away
  }

  function stampReveal() {
    const p = $('impPanel');
    p.classList.remove('stamp');
    void p.offsetWidth;
    p.classList.add('stamp');
  }

  function doReveal() {
    stopTimer();
    keepAwake(false);
    const names = impostorIndexes().map(nameOf);
    $('impPanelLbl').textContent = names.length > 1 ? t('theImpostersWere') : t('theImposterWas');
    $('impPanelVal').textContent = names.join(t('andJoin'));
    $('wordPanelVal').textContent = wordMain();
    $('wordPanelSub').textContent = wordSub();
    buzz([80, 60, 80, 60, 160]);
    show('scr-reveal', 1);
    stampReveal();
  }

  /* ---------------- sheets ---------------- */
  let pendingYes = null;

  function askConfirm(msgKey, yesKey, onYes) {
    $('sheetMsg').textContent = t(msgKey);
    $('confirmYes').textContent = t(yesKey);
    pendingYes = onYes;
    $('confirmSheet').classList.add('on');
  }
  function closeSheet() { $('confirmSheet').classList.remove('on'); pendingYes = null; }

  /* ---------------- wiring ---------------- */
  function toggleLang() {
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    save(); applyLang();
  }
  $('langBtn').addEventListener('click', toggleLang);
  $('homeLang').addEventListener('click', toggleLang);

  $('themeBtn').addEventListener('click', () => {
    state.theme = resolvedTheme() === 'dark' ? 'light' : 'dark';
    save(); applyTheme();
  });
  $('themeSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.theme = b.dataset.v;
    save(); applyTheme();
  });

  $('homePlay').addEventListener('click', () => show('scr-setup', 1));
  $('setupBack').addEventListener('click', () => show('scr-home', -1));
  $('howBtn').addEventListener('click', () => $('howSheet').classList.add('on'));
  $('howClose').addEventListener('click', () => $('howSheet').classList.remove('on'));
  $('howSheet').addEventListener('click', e => {
    if (e.target === $('howSheet')) $('howSheet').classList.remove('on');
  });

  $('addBtn').addEventListener('click', () => {
    if (state.players.length >= MAX_PLAYERS) return;
    state.players.push('');
    save(); renderPlayers(); renderSegs(); validate();
  });

  $('catAll').addEventListener('click', () => {
    state.cats = CATEGORIES.map(c => c.id);
    save(); renderCats(); validate();
  });
  $('catNone').addEventListener('click', () => {
    state.cats = [];
    save(); renderCats(); validate();
  });

  $('impSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    state.imposters = +b.dataset.v;
    save(); renderSegs(); validate();
  });

  $('swPartners').addEventListener('click', () => {
    if ($('swPartners').disabled) return;
    state.partners = !state.partners;
    save(); renderSegs();
  });
  $('swHint').addEventListener('click', () => {
    state.hint = !state.hint;
    save(); renderSegs();
  });

  $('timerSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.timerMin = +b.dataset.v;
    save(); renderSegs();
  });

  $('startBtn').addEventListener('click', () => {
    if ($('startBtn').disabled) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    deal(); playDeal(() => showPass(1));
  });

  $('imBtn').addEventListener('click', showCard);
  $('flip').addEventListener('click', flipCard);

  $('doneBtn').addEventListener('click', () => {
    if ($('doneBtn').classList.contains('veil')) return;
    state.idx++;
    if (state.idx >= state.players.length) showStarter(); else showPass(1);
  });

  $('playBtn').addEventListener('click', startPlay);
  $('pauseBtn').addEventListener('click', togglePause);
  $('addMinBtn').addEventListener('click', addMinute);

  function backToSetup() { stopTimer(); keepAwake(false); show('scr-setup', -1); }

  $('revealBtn').addEventListener('click', () => askConfirm('confirmReveal', 'yesReveal', doReveal));
  $('exitBtn').addEventListener('click', () => askConfirm('confirmExit', 'yesExit', backToSetup));
  $('confirmNo').addEventListener('click', closeSheet);
  $('confirmYes').addEventListener('click', () => {
    const fn = pendingYes;
    closeSheet();
    if (fn) fn();
  });

  $('againBtn').addEventListener('click', () => { deal(); playDeal(() => showPass(1)); });
  $('backBtn').addEventListener('click', backToSetup);

  /* ---------------- boot ---------------- */
  load();
  applyTheme();
  applyLang();

  // splash, then the start screen. tapping anywhere cuts it short.
  let splashDone = false;
  function leaveSplash() {
    if (splashDone) return;
    splashDone = true;
    show('scr-home', 1);
  }
  $('scr-splash').addEventListener('click', leaveSplash);
  setTimeout(leaveSplash, reduceMotion ? 200 : 2350);
})();
</script>
</body>
</html>
